[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telequick-agents"
version = "0.3.0"
description = "TeleQuick external-agent SDK: run your own voice agent over the TeleQuick QUIC media plane, plus the mpk_ control-plane client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
quic = ["aioquic>=1.0"]

[tool.setuptools.packages.find]
include = ["telequick_agents*"]
